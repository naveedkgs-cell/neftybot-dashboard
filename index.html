<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeftyBot V2</title>
<style>
body{background:#0f1214;color:#fff;font-family:system-ui;padding:20px;margin:0}
.card{background:#1a1f24;border-radius:16px;padding:20px;max-width:480px;margin:auto}
input{width:100%;background:#121518;border:1px solid #2a3239;color:#fff;padding:12px;border-radius:10px;margin:8px 0 14px 0}
.btn{padding:12px 16px;border-radius:10px;border:none;font-weight:700}
.save{background:#00e676;color:#000;width:60%}
.clear{background:#2a3239;color:#fff;width:38%}
</style>
</head>
<body>
<div class="card">
<h2>NeftyBot V2</h2>
<label>Dhan Client ID</label>
<input id="cid" placeholder="1113333377">
<label>Dhan Access Token (JWT)</label>
<input id="tok" type="password" placeholder="Paste JWT Token">
<div style="display:flex;gap:8px;margin-top:10px">
<button class="btn save" onclick="localStorage.setItem('dhan_cid',cid.value);localStorage.setItem('dhan_tok',tok.value);alert('V2 Connected!')">Save & Connect</button>
<button class="btn clear" onclick="localStorage.clear();cid.value='';tok.value=''">Clear</button>
</div>
<p style="font-size:11px;color:#7a848d;margin-top:10px">Token phone me hi save hota hai.</p>
</div>
</body>
</html>
